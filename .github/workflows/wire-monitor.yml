name: 24/7 Breaking Wire Monitor
on:
  schedule:
    # Every 30 mins around the clock 24/7 (00:00 - 24:00 UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire_monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install beautifulsoup4 yfinance
      - name: Run 24/7 Wire Monitor
        run: python scripts/monitor-breaking.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Catch-up Check for Scheduled Briefings
        run: python scripts/catchup-briefings.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_BASE_URL: ${{ vars.BRIEFING_BASE_URL }}
      - name: Commit Updated Wire Data & Editions
        run: |
          git config user.name "The Oracle Wire"
          git config user.email "oracle-wire@antigravity.internal"
          git add scripts/live-wire.json docs/live-wire.json docs/ briefings/ scripts/*.json || true
          git diff --staged --quiet || (git commit -m "⚡ [Wire Update] Sync live wire & editions [skip-ci-dispatch]" && git push)
