name: Portal reading checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/assets/edition-registry.js', 'docs/data/editions.json', 'scripts/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright beautifulsoup4
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_checks.py --screenshots /tmp/oracle-portal-preview
      - run: python tests/latest_browser_checks.py --screenshots /tmp/oracle-central-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-portal-desktop-mobile-preview
          path: |
            /tmp/oracle-portal-preview
            /tmp/oracle-central-preview

      - name: Expose reviewed screenshot bytes for visual inspection
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for size in ("375","1440"):
              path=Path(".review")/(size+"-compact-markets.png")
              encoded=base64.b64encode(path.read_bytes()).decode("ascii")
              print("BEGIN_PNG_"+size,flush=True)
              for index in range(0,len(encoded),120):
                  print(encoded[index:index+120],flush=True)
              print("END_PNG_"+size,flush=True)
          PY
