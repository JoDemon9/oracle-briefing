name: Portal reading checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/assets/edition-registry.js', 'docs/data/editions.json', 'scripts/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      full_regression:
        description: Also run historical portal/Wire browser audits
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select publication checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REGRESSION: ${{ github.event.inputs.full_regression || 'false' }}
        run: |
          if [ "$FULL_REGRESSION" = "true" ]; then
            python scripts/check_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT" --full-regression
          else
            python scripts/check_scope.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright beautifulsoup4
      - if: steps.scope.outputs.profile != 'central'
        run: python -m unittest discover -s tests -q
      - run: python -m playwright install --with-deps chromium
      - if: steps.scope.outputs.profile == 'full'
        run: python tests/browser_checks.py --screenshots /tmp/oracle-portal-preview
      - run: python tests/daily_smoke.py --screenshots /tmp/oracle-central-preview
      - if: steps.scope.outputs.profile == 'full'
        run: python tests/latest_browser_checks.py --screenshots /tmp/oracle-extended-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-portal-desktop-mobile-preview
          path: |
            .work/check-scope.json
            /tmp/oracle-portal-preview
            /tmp/oracle-central-preview
            /tmp/oracle-extended-preview
