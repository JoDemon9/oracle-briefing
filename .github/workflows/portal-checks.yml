name: Portal reading checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/assets/edition-registry.js', 'docs/data/editions.json', 'tests/browser_checks.py']
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_checks.py --screenshots /tmp/oracle-portal-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-portal-desktop-mobile-preview
          path: /tmp/oracle-portal-preview
