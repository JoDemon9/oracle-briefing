name: 24/7 Sovereign Intelligence Engine (Editions)
on:
  schedule:
    # 07:30 AM Cyprus Time (EEST, UTC+3) — Flagship Morning Broadsheet
    - cron: '30 4 * * *'
    # 13:30 PM Cyprus Time (EEST, UTC+3) — Midday Market Pulse
    - cron: '30 10 * * *'
    # 19:30 PM Cyprus Time (EEST, UTC+3) — Evening Debrief & Global Wrap
    - cron: '30 16 * * *'
  push:
    paths: ['docs/briefings/**', 'briefings/**', '.github/workflows/notify.yml']
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to run (morning, midday, evening, auto)'
        required: false
        default: 'auto'

concurrency:
  group: oracle-edition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  edition_dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Python Dependencies & Antigravity SDK
        run: pip install google-antigravity beautifulsoup4 yfinance

      - name: Resolve Edition
        id: resolve_edition
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.edition }}" ] && [ "${{ github.event.inputs.edition }}" != "auto" ]; then
            EDITION="${{ github.event.inputs.edition }}"
          elif [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
            EDITION="morning"
          elif [ "${{ github.event.schedule }}" = "30 10 * * *" ]; then
            EDITION="midday"
          elif [ "${{ github.event.schedule }}" = "30 16 * * *" ]; then
            EDITION="evening"
          else
            EDITION="auto"
          fi
          echo "edition=$EDITION" >> $GITHUB_OUTPUT
          echo "Resolved edition: $EDITION"

      - name: Run Autonomous Antigravity Sovereign Agent
        run: python scripts/agent-runner.py --edition ${{ steps.resolve_edition.outputs.edition }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_BASE_URL: ${{ vars.BRIEFING_BASE_URL }}

      - name: Dispatch Briefing to Telegram
        if: "!cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-ci-dispatch]'))"
        run: |
          python scripts/send-briefing.py --edition ${{ steps.resolve_edition.outputs.edition }} 2>&1 | tee dispatch.log
          echo "## Telegram Dispatch Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat dispatch.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_BASE_URL: ${{ vars.BRIEFING_BASE_URL }}

      - name: Commit & Push Broadsheet Editions
        if: always()
        run: |
          git config user.name "The Oracle Sovereign Agent"
          git config user.email "oracle-agent@antigravity.internal"
          git add docs/ briefings/ scripts/*.json dispatch.log || true
          git diff --staged --quiet || (git commit -m "🤖 [Oracle Sovereign Agent] Auto-edition update [skip-ci-dispatch]" && git push)
