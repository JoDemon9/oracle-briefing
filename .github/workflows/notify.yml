name: 24/7 Sovereign Intelligence Engine
on:
  schedule:
    # 07:30 AM Cyprus Time (EEST, UTC+3) — Flagship Morning Broadsheet
    - cron: '30 4 * * *'
    # 13:30 PM Cyprus Time (EEST, UTC+3) — Midday Market Pulse
    - cron: '30 10 * * *'
    # 19:30 PM Cyprus Time (EEST, UTC+3) — Evening Debrief & Global Wrap
    - cron: '30 16 * * *'
    # Every 30 mins between 08:00 - 21:00 Cyprus Time — Real-time Breaking Wire Monitor
    - cron: '*/30 5-18 * * *'
  push:
    paths: ['docs/briefings/*.md', 'briefings/*.md']
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to run (morning, midday, evening, wire)'
        required: false
        default: 'morning'

jobs:
  wire_monitor:
    # Only run wire monitor on the 30-min cron ticks
    if: "github.event_name == 'schedule' && github.event.schedule == '*/30 5-18 * * *'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install beautifulsoup4
      - name: Run 24/7 Wire Monitor
        run: python scripts/monitor-breaking.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit Updated Wire Data
        run: |
          git config user.name "The Oracle Wire"
          git config user.email "oracle-wire@antigravity.internal"
          git add scripts/live-wire.json docs/live-wire.json || true
          git diff --staged --quiet || (git commit -m "⚡ [Wire Update] Sync live wire ticker [skip-ci-dispatch]" && git push)

  edition_dispatch:
    # Run on scheduled edition times, git push, or manual dispatch
    if: "github.event_name != 'schedule' || github.event.schedule != '*/30 5-18 * * *'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Python Dependencies & Antigravity SDK
        run: pip install google-antigravity beautifulsoup4 yfinance
      - name: Run Autonomous Antigravity Sovereign Agent
        run: python scripts/agent-runner.py --edition ${{ github.event.inputs.edition || 'auto' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_BASE_URL: ${{ vars.BRIEFING_BASE_URL }}
      - name: Commit & Push Broadsheet Editions
        run: |
          git config user.name "The Oracle Sovereign Agent"
          git config user.email "oracle-agent@antigravity.internal"
          git add docs/ briefings/ scripts/*.json || true
          git diff --staged --quiet || (git commit -m "🤖 [Oracle Sovereign Agent] Auto-edition update [skip-ci-dispatch]" && git push)
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Dispatch Briefing to Telegram
        if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-ci-dispatch]')"
        run: node scripts/send-briefing.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEFING_BASE_URL: ${{ vars.BRIEFING_BASE_URL }}

